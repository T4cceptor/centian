version: "0.1"

case:
  id: "assertion_failure_red"
  name: "Assertion-failure red baseline"
  description: "An authored red baseline where the selected command fails via deterministic assertion output."

promptFile: "prompt.yaml"

fixture:
  seedPath: "fixture"
  resetMode: "copy_seed"
  startingRepoStateSummary: "Authored red baseline already exists; production code returns the wrong behavior."

expectations:
  selectedCommand: "go test ./internal/health -run TestHealthStatus"
  redSignal:
    type: "output_contains"
    value: "expected ready, got not_ready"
  greenConditionSummary: "The selected command exits 0 without modifying the locked baseline test file."

constraints:
  lockedPaths:
    - "internal/health/health_test.go"
  allowedAdditionalPaths:
    - "internal/health"
