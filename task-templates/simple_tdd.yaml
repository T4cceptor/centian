version: "0.1"
task:
  id: "simple_tdd"
  name: "Simple TDD Task"
  description: "A small two-step TDD workflow with parameterized test commands."
parameters:
  - name: "testCommand"
    description: "The command prefix used to execute the targeted test, for example `npm run test -- -g`."
  - name: "testFile"
    description: "The path or selector for the test file or test target."
  - name: "expectedError"
    description: "A stable substring expected in the initial failing test output."
workflow:
  onboarding:
    tools_allowed:
      - "shell__*"
      - "filesystem__*"
  planning:
    tools_allowed:
      - "shell__*"
      - "filesystem__*"
    editable_fields:
      - "parameters.testCommand"
      - "parameters.testFile"
      - "parameters.expectedError"
    required_inputs:
      - "expectedError"
      - "testCommand"
      - "testFile"
  execution:
    - id: "create_failing_test_baseline"
      name: "Create failing test baseline"
      tools_allowed:
        - "shell__*"
        - "filesystem__*"
      checks:
        - id: "selected_test_fails"
          command: "${testCommand} ${testFile}"
          pre_conditions:
            - type: exit_code_in
              values: [0, 1]
          post_conditions:
            - type: exit_code
              value: 1
            - type: stdout_contains
              value: "${expectedError}"
      invariants:
        - id: "test_file_stable"
          command: "cat ${testFile}"
    - id: "implement_fix"
      name: "Implement production fix"
      tools_allowed:
        - "shell__*"
        - "filesystem__*"
      checks:
        - id: "selected_test_passes"
          command: "${testCommand} ${testFile}"
          post_conditions:
            - type: exit_code
              value: 0
      invariants:
        - id: "test_file_stable"
          command: "cat ${testFile}"
