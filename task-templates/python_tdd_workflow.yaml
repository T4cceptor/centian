version: "0.1"
task:
  id: "python_tdd_workflow"
  name: "Python TDD Workflow"
  description: "Use Centian to drive a Python TDD loop with an explicit failing-test step followed by an implementation step."
  instructions: |
    Use Centian task verification as the authoritative process for this task.

    Expectations:
    - Register the task, then follow the step boundaries in order.
    - Prefer `centian.task_start_step` and `centian.task_complete_step` over manually rebuilding the full validation flow.
    - Treat `centian.task_complete_step` as the source of truth for whether a step passes.
    - Use shell and filesystem tools only to gather focused context, derive parameters, and make targeted edits.
    - If a step fails, use the Centian failure message to decide the next fix.
    - Once step 2 has started, keep the selected test file stable.
parameters:
  - name: "testCommand"
    description: "The command prefix used to run the selected pytest target, for example `python -m pytest -q`."
  - name: "testTarget"
    description: "The pytest target to execute. This can be a file path or a selector such as `tests/test_x.py::test_case`."
  - name: "testFile"
    description: "The concrete path to the pytest file used for invariants, for example `tests/test_x.py`."
  - name: "lintCommand"
    description: "The command used to run linting for the project."
  - name: "expectedError"
    description: "A stable substring expected in the failing test output for the initial TDD baseline."
steps:
  - id: "establish_failing_baseline"
    name: "Establish failing baseline"
    instructions: |
      Create or identify the target pytest case so it fails for the intended reason.
      The pass/fail decision for this step comes from `centian.task_complete_step`.
    checks:
      - id: "selected_test_fails"
        command: "cd /workspace/project && ${testCommand} ${testTarget}"
        pre_conditions:
          - type: exit_code_in
            values: [0, 1, 4]
        post_conditions:
          - type: exit_code
            value: 1
          - type: stdout_contains
            value: "${expectedError}"
  - id: "implement_solution"
    name: "Implement solution"
    instructions: |
      Start this step before changing production code.
      Make the implementation pass the selected test, then let Centian verify the step.
      Once this step is active, keep the selected test file stable.
    checks:
      - id: "selected_test_passes"
        command: "cd /workspace/project && ${testCommand} ${testTarget}"
        pre_conditions:
          - type: exit_code
            value: 1
        post_conditions:
          - type: exit_code
            value: 0
      - id: "project_lint_passes"
        command: "cd /workspace/project && ${lintCommand}"
        post_conditions:
          - type: exit_code
            value: 0
    invariants:
      - id: "test_file_stable"
        command: "cd /workspace/project && cat ${testFile}"
