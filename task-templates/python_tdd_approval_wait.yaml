version: "0.1"
task:
  id: "python_tdd_approval_wait"
  name: "Python TDD Workflow With Approval Wait"
  description: "Use Centian to prepare a Python TDD task, then stop at an approval gate before execution."
  instructions: |
    Use Centian task verification as the authoritative process for this task.

    Expectations:
    - Register the task, complete onboarding, and complete planning before any execution step begins.
    - Treat the planning result as the source of truth for whether the task has entered the approval wait.
    - While the workflow is in `waiting_for_approval`, proxied shell and filesystem actions should be blocked.
parameters:
  - name: "testCommand"
    description: "The command prefix used to run the selected pytest target, for example `python -m pytest -q`."
  - name: "testTarget"
    description: "The pytest target to execute. This can be a file path or a selector such as `tests/test_x.py::test_case`."
  - name: "testFile"
    description: "The concrete path to the pytest file used for invariants, for example `tests/test_x.py`."
  - name: "lintCommand"
    description: "The command used to run linting for the project."
  - name: "expectedError"
    description: "A stable substring expected in the failing test output for the initial TDD baseline."
workflow:
  onboarding:
    instructions: |
      Identify the concrete pytest target, relevant source files, and project commands before planning.
    tools_allowed:
      - "shell__*"
      - "filesystem__*"
  planning:
    tools_allowed:
      - "shell__*"
      - "filesystem__*"
    editable_fields:
      - "parameters.testCommand"
      - "parameters.testTarget"
      - "parameters.testFile"
      - "parameters.lintCommand"
      - "parameters.expectedError"
    required_outputs:
      - "selectedFiles"
      - "testTarget"
      - "lintCommand"
      - "expectedFailure"
      - "implementationTarget"
    next: "waiting_for_approval.review_plan"
  execution:
    - id: "review_plan"
      kind: "waiting_for_approval"
      name: "Review plan"
      instructions: |
        This node intentionally pauses execution until approval is granted.
        Proxied shell and filesystem tools should be blocked while waiting here.
      tools_allowed:
        - "shell__*"
        - "filesystem__*"
      next: "execution.establish_failing_baseline"
    - id: "establish_failing_baseline"
      name: "Establish failing baseline"
      tools_allowed:
        - "shell__*"
        - "filesystem__*"
      instructions: |
        Create or identify the target pytest case so it fails for the intended reason.
      checks:
        - id: "selected_test_fails"
          command: "cd /workspace/project && ${testCommand} ${testTarget}"
          pre_conditions:
            - type: exit_code_in
              values: [0, 1, 4]
          post_conditions:
            - type: exit_code
              value: 1
            - type: stdout_contains
              value: "${expectedError}"
    - id: "implement_solution"
      name: "Implement solution"
      tools_allowed:
        - "shell__*"
        - "filesystem__*"
      instructions: |
        Start this step before changing production code.
        Make the implementation pass the selected test, then let Centian verify the step.
      checks:
        - id: "selected_test_passes"
          command: "cd /workspace/project && ${testCommand} ${testTarget}"
          pre_conditions:
            - type: exit_code
              value: 1
          post_conditions:
            - type: exit_code
              value: 0
        - id: "project_lint_passes"
          command: "cd /workspace/project && ${lintCommand}"
          post_conditions:
            - type: exit_code
              value: 0
      invariants:
        - id: "test_file_stable"
          command: "cd /workspace/project && cat ${testFile}"
