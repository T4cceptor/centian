services:
  centian:
    build:
      context: ../..
      dockerfile: demo/taskverification/Dockerfile.centian
    container_name: centian-taskverification-demo
    environment:
      CENTIAN_LOG_DIR: /artifacts/logs
    ports:
      - "127.0.0.1:${CENTIAN_TASKVERIFICATION_PORT:-8678}:8080"
    volumes:
      - ./project:/workspace/project
      - ./artifacts:/artifacts
    networks:
      - shared

  agent:
    build:
      context: ../..
      dockerfile: demo/taskverification/Dockerfile.agent
    depends_on:
      - centian
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CENTIAN_URL: http://centian:8080/mcp/taskverification
      CODEX_MODEL: ${CODEX_MODEL:-}
      PROMPT_PATH: ${PROMPT_PATH:-/agent/prompts/problem_score_parentheses.md}
    volumes:
      - ./agent:/agent:ro
      - ./artifacts:/artifacts
    networks:
      - shared
      - internet

networks:
  shared:
  internet:
