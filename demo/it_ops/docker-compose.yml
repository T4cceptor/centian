services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: centian_it_ops
      POSTGRES_USER: centian
      POSTGRES_PASSWORD: centian_dev_password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - centian_it_ops_postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centian -d centian_it_ops"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  centian_it_ops_postgres_data:
    name: centian_it_ops_postgres_data
